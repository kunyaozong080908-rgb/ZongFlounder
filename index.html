<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZongFlounder 智学乐园 · 小学益智大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233da9fc'/%3E%3Cpath d='M14 40c8-14 28-14 36 0-8 6-28 6-36 0z' fill='%23ffd166'/%3E%3Ccircle cx='24' cy='36' r='3' fill='%232b3a55'/%3E%3Ccircle cx='40' cy='36' r='3' fill='%232b3a55'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2b3a55; --paper:#ffffff; --bg1:#eaf4ff; --bg2:#fff7e0;
  --orange:#ff8a5c; --blue:#3da9fc; --green:#43c59e; --gold:#ffc93c;
  --red:#ef6f6c; --soft:#8aa0bd; --radius:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  min-height:100vh;overflow-x:hidden;
}
.deco{position:fixed;border-radius:50%;opacity:.35;pointer-events:none;z-index:0}
.deco.d1{width:280px;height:280px;background:#bfe3ff;top:-90px;left:-80px}
.deco.d2{width:200px;height:200px;background:#ffe3a8;bottom:-70px;right:-60px}
.deco.d3{width:140px;height:140px;background:#c8f0df;top:40%;right:8%;opacity:.5}

header{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);
  border-bottom:2px solid rgba(43,58,85,.06);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--blue)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--soft);letter-spacing:1px}
.hud{display:flex;align-items:center;gap:10px}
.star-pill{display:flex;align-items:center;gap:6px;background:#fff6dd;border:2px solid #ffe2a3;color:#c98a00;
  font-weight:800;padding:8px 14px;border-radius:999px;font-size:16px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:2px solid rgba(43,58,85,.12);background:#fff;
  display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

main{position:relative;z-index:1;width:100%;max-width:860px;margin:0 auto;padding:26px 18px 60px}
.view{display:none;animation:pop .35s ease}
.view.active{display:block}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:34px;font-weight:900;margin-bottom:8px}
.hero p{color:var(--soft);font-size:17px;font-weight:600}

.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.subject-card{border:none;cursor:pointer;text-align:left;padding:26px 20px;border-radius:var(--radius);
  color:#fff;box-shadow:0 10px 24px rgba(43,58,85,.14);transition:transform .18s;min-height:190px;
  display:flex;flex-direction:column;justify-content:space-between}
.subject-card:active{transform:translateY(3px) scale(.98)}
.subject-card .ico{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.subject-card h3{font-size:23px;font-weight:900;margin-top:14px}
.subject-card p{font-size:14px;opacity:.92;margin-top:4px;font-weight:600}
.subject-card.chinese{background:linear-gradient(150deg,#ff9d76,#ff7a4d)}
.subject-card.math{background:linear-gradient(150deg,#5bb6ff,#2f93ea)}
.subject-card.english{background:linear-gradient(150deg,#5cd3ae,#2fae83)}

.home-tools{display:flex;gap:14px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.tool-entry{display:flex;align-items:center;gap:10px;border:2px solid #d8e1ee;background:#fff;color:var(--ink);
  font-weight:800;border-radius:999px;padding:12px 24px;font-size:16px;cursor:pointer}
.tool-entry:active{transform:scale(.96)}
.tool-entry .badge-count{background:var(--red);color:#fff;border-radius:999px;font-size:13px;padding:1px 9px;font-weight:900}

.level-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.level-head .tag{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;flex:none}
.level-head h2{font-size:24px;font-weight:900}
.level-head p{color:var(--soft);font-size:14px;font-weight:600}
.level-grid{display:grid;gap:14px}
.level-card{display:flex;align-items:center;gap:16px;justify-content:space-between;width:100%;cursor:pointer;
  border:3px solid #eef2f8;background:#fff;border-radius:20px;padding:20px 22px;text-align:left;transition:transform .15s}
.level-card:active{transform:scale(.98)}
.level-card .lv-badge{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;flex:none}
.level-card .lv-text{flex:1;min-width:0}
.level-card h4{font-size:19px;font-weight:900}
.level-card p{color:var(--soft);font-size:14px;font-weight:600;margin-top:2px}
.level-card .arrow{flex:none;color:var(--soft)}

/* 模式选择 */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode-card{cursor:pointer;border:3px solid #eef2f8;background:#fff;border-radius:20px;padding:24px;text-align:left;transition:transform .15s}
.mode-card:active{transform:scale(.97)}
.mode-card .m-ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;margin-bottom:12px}
.mode-card h4{font-size:20px;font-weight:900;margin-bottom:6px}
.mode-card p{color:var(--soft);font-size:14px;font-weight:600;line-height:1.5}

/* 关卡格子 */
.stage-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:8px}
.stage-cell{cursor:pointer;border:3px solid #eef2f8;background:#fff;border-radius:16px;padding:14px 8px;
  text-align:center;transition:transform .15s;position:relative}
.stage-cell:active{transform:scale(.95)}
.stage-cell .num{font-size:22px;font-weight:900}
.stage-cell .st{margin-top:6px;font-size:14px;letter-spacing:1px}
.stage-cell.done{border-color:#b9e7d2;background:#f1fbf6}
.stage-cell .lock{position:absolute;top:6px;right:8px;color:var(--soft)}

.btn-ghost{border:2px solid #d8e1ee;background:#fff;color:var(--ink);font-weight:800;border-radius:999px;
  padding:12px 26px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-ghost:active{transform:scale(.96)}
.back-row{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}

/* 答题区 */
.quiz-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.quiz-top .subj-dot{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.progress-wrap{flex:1}
.progress-meta{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:var(--soft);margin-bottom:6px}
.progress-bar{height:14px;border-radius:999px;background:#e6edf6;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#ffb02e);width:0;transition:width .35s}
.score-inline{font-weight:900;color:#c98a00;background:#fff6dd;border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap}

.question-box{background:#fff;border-radius:var(--radius);padding:30px 26px;box-shadow:0 10px 26px rgba(43,58,85,.1)}
.question{font-size:25px;font-weight:900;line-height:1.5;margin-bottom:24px;min-height:70px}
.options{display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;border:3px solid #eef2f8;background:#fbfdff;
  border-radius:18px;padding:16px 20px;font-size:19px;font-weight:800;color:var(--ink);text-align:left;transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt .key{width:34px;height:34px;border-radius:10px;background:#eef3fa;display:grid;place-items:center;
  font-size:16px;font-weight:900;color:var(--soft);flex:none}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:#e8faf2}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fdecec}
.opt.wrong .key{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:20px;display:none;align-items:center;gap:10px;font-size:17px;font-weight:800;border-radius:14px;padding:14px 16px}
.feedback.show{display:flex;animation:pop .25s}
.feedback.good{background:#e8faf2;color:#1f9d6b}
.feedback.bad{background:#fdecec;color:#d9534f}
.tip-line{font-weight:600;font-size:15px;margin-top:4px;color:var(--ink)}

/* 结算 */
.result-card{background:#fff;border-radius:var(--radius);padding:36px 28px;text-align:center;box-shadow:0 12px 30px rgba(43,58,85,.14)}
.result-stars{display:flex;justify-content:center;gap:10px;margin:10px 0 18px}
.result-stars svg{width:62px;height:62px}
.result-stars .off{opacity:.25}
.result-card h2{font-size:28px;font-weight:900;margin-bottom:6px}
.result-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px 0}
.stat-box{background:#f6f9fd;border-radius:16px;padding:14px 22px;min-width:110px}
.stat-box b{font-size:26px;font-weight:900;display:block}
.stat-box span{font-size:13px;color:var(--soft);font-weight:700}
.result-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.btn-primary{border:none;background:linear-gradient(135deg,#ffc94d,#ffb02e);color:#5b4300;font-weight:900;
  border-radius:999px;padding:14px 34px;font-size:17px;cursor:pointer;box-shadow:0 8px 18px rgba(255,176,46,.4)}
.btn-primary:active{transform:scale(.96)}

/* 错题集 */
.wrong-head-row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:14px}
.wr-item{background:#fdf6f6;border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:15px;font-weight:600;line-height:1.5}
.wr-item .ans{color:#1f9d6b;font-weight:900}
.wr-item .pick{color:#d9534f;font-weight:900}
.empty-state{text-align:center;color:var(--soft);font-weight:700;padding:60px 20px;font-size:17px}

.confetti{position:fixed;top:50%;left:50%;width:12px;height:12px;border-radius:3px;z-index:99;pointer-events:none}

@media (max-width:680px){
  .subject-grid{grid-template-columns:1fr;gap:14px}
  .subject-card{min-height:0;flex-direction:row;align-items:center;gap:14px;padding:20px}
  .subject-card h3{margin-top:0}
  .mode-grid{grid-template-columns:1fr}
  .stage-grid{grid-template-columns:repeat(3,1fr)}
  .question{font-size:21px;min-height:0}
  .opt{font-size:17px}
  .hero h1{font-size:27px}
  main{padding:18px 14px 50px}
}
</style>
</head>
<body>
<div class="deco d1" aria-hidden="true"></div>
<div class="deco d2" aria-hidden="true"></div>
<div class="deco d3" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 64 64"><path d="M14 40c8-14 28-14 36 0-8 6-28 6-36 0z" fill="#fff"/><circle cx="24" cy="36" r="3.4" fill="#2b3a55"/><circle cx="40" cy="36" r="3.4" fill="#2b3a55"/></svg>
    </span>
    <span>ZongFlounder<small>智学乐园</small></span>
  </div>
  <div class="hud">
    <span class="star-pill"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z" fill="#ffb02e"/></svg><b id="totalStars">0</b></span>
    <button class="icon-btn" id="muteBtn" aria-label="声音开关" title="声音开关">
      <svg id="soundOnIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2b3a55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
      <svg id="soundOffIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2b3a55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5L6 9H2v6h4l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- 首页 -->
  <section class="view active" id="view-home">
    <div class="hero">
      <h1>小学益智大冒险</h1>
      <p>选一个板块开始闯关，题目参照人教版课本，答对可以收集星星！</p>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
    <div class="home-tools">
      <button class="tool-entry" onclick="openWrongBook()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef6f6c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        错题集<span class="badge-count" id="wrongCount">0</span>
      </button>
    </div>
  </section>

  <!-- 年级选择 -->
  <section class="view" id="view-level">
    <div class="level-head">
      <span class="tag" id="levelTag"></span>
      <div><h2 id="levelTitle"></h2><p id="levelDesc"></p></div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="back-row"><button class="btn-ghost" onclick="goHome()">← 返回首页</button></div>
  </section>

  <!-- 模式选择 -->
  <section class="view" id="view-mode">
    <div class="level-head">
      <span class="tag" id="modeTag"></span>
      <div><h2 id="modeTitle"></h2><p id="modeDesc"></p></div>
    </div>
    <div class="mode-grid" id="modeGrid"></div>
    <div class="back-row"><button class="btn-ghost" onclick="backToLevel()">← 返回年级</button></div>
  </section>

  <!-- 关卡格子 -->
  <section class="view" id="view-stages">
    <div class="level-head">
      <span class="tag" id="stageTag"></span>
    </div>
  </section>
</main>
</body>
</html>
