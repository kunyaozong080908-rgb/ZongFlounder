<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZongFlounder 智学乐园 · 小学益智大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233da9fc'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="deco d1" aria-hidden="true"></div>
<div class="deco d2" aria-hidden="true"></div>
<div class="deco d3" aria-hidden="true"></div>

<header>
  <div class="brand">
    <span class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6z"/><circle cx="12" cy="12" r="1.4" fill="#fff" stroke="none"/></svg>
    </span>
    <span>ZongFlounder<small>智学乐园</small></span>
  </div>
  <div class="hud">
    <span class="star-pill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffc93c"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>
      <span id="totalStars">0</span>
    </span>
    <button class="icon-btn" id="muteBtn" aria-label="声音开关">
      <svg id="soundOnIco" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b3a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
      <svg id="soundOffIco" style="display:none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2b3a55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6"/><path d="M17 9l6 6"/></svg>
    </button>
  </div>
</header>

<main>
  <!-- ===== 视图：首页 ===== -->
  <section class="view active" id="view-home">
    <div class="hero">
      <h1>小学益智大冒险</h1>
      <p>选一个板块开始闯关，题目参照人教版课本，答对可以收集星星！</p>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
    <div class="home-tools">
      <button class="tool-entry" onclick="openWrongBook()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ef6f6c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        错题集 <span class="badge-count" id="wrongCount">0</span>
      </button>
    </div>
  </section>

  <!-- ===== 视图：年级选择 ===== -->
  <section class="view" id="view-level">
    <div class="level-head">
      <span class="tag" id="levelTag"></span>
      <div><h2 id="levelTitle"></h2><p id="levelDesc"></p></div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="back-row"><button class="btn-ghost" onclick="goHome()">← 返回首页</button></div>
  </section>

  <!-- ===== 视图：模式选择 ===== -->
  <section class="view" id="view-mode">
    <div class="level-head">
      <span class="tag" id="modeTag"></span>
      <div><h2 id="modeTitle"></h2><p id="modeDesc"></p></div>
    </div>
    <div class="mode-grid" id="modeGrid"></div>
    <div class="back-row"><button class="btn-ghost" onclick="backToLevel()">← 返回年级</button></div>
  </section>

  <!-- ===== 视图：关卡（动态渲染） ===== -->
  <section class="view" id="view-stages"></section>

  <!-- ===== 视图：答题 ===== -->
  <section class="view" id="view-quiz">
    <div class="quiz-top">
      <span id="quizDot"></span>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="quizMode"></span><span id="quizProgress"></span></div>
        <div class="progress-bar"><div class="progress-fill" id="quizFill"></div></div>
      </div>
      <span class="score-inline" id="quizScore">0 分</span>
    </div>
    <div class="question-box">
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
      <div class="back-row" style="margin-top:18px">
        <button class="btn-primary" id="nextBtn" style="display:none" onclick="nextQuestion()">下一题</button>
      </div>
    </div>
  </section>

  <!-- ===== 视图：结算 ===== -->
  <section class="view" id="view-result">
    <div class="result-card">
      <div class="result-stars" id="resultStars"></div>
      <h2 id="resultTitle"></h2>
      <div class="result-stats">
        <div class="stat-box"><b id="statCorrect">0</b><span>答对题数</span></div>
        <div class="stat-box"><b id="statRate">0%</b><span>正确率</span></div>
        <div class="stat-box"><b id="statScore">0</b><span>得分</span></div>
      </div>
      <div class="result-actions" id="resultActions"></div>
    </div>
  </section>

  <!-- ===== 视图：错题集 ===== -->
  <section class="view" id="view-wrong">
    <div class="hero" style="margin-bottom:16px">
      <h1 style="font-size:28px">我的错题集</h1>
      <p>答错的题自动收在这里，复习时可以重做，做对就会移走。</p>
    </div>
    <div class="wrong-head-row">
      <button class="btn-ghost" onclick="startWrongReview()">开始重做</button>
      <button class="btn-ghost" onclick="clearWrongBook()">清空错题</button>
    </div>
    <div id="wrongList"></div>
    <div class="back-row"><button class="btn-ghost" onclick="goHome()">← 返回首页</button></div>
  </section>
</main>

<script src="data_chinese.js"></script>
<script src="data_chinese2.js"></script>
<script src="data_math.js"></script>
<script src="data_english.js"></script>
<script src="data_english2.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="game.js"></script>
</body>
</html>
